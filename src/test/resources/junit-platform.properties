# Every test gets a deadline, enforced from another thread.
#
# JUnit's default timeout mode is SAME_THREAD, which cannot interrupt a test
# already blocked in Future.join() — it only reports the overrun once the test
# returns, which a hung test never does. Two rounds of this project lost half
# an hour each to a build that hung forever on exactly that, including once
# with a @Timeout annotation present and useless.
#
# SEPARATE_THREAD makes the deadline real: a blocked test fails in seconds and
# the build moves on.
junit.jupiter.execution.timeout.default = 30s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
