# ==============================================================================
# SocialBlueprint Configuration
# ==============================================================================

# Active language (SB-066, T-032a). Supported: 'en', 'es'.
# Loads messages_en.yml or messages_es.yml from the data folder.
language: es

# Chat prefix prepended to player-facing messages and notifications (SB-062).
chat-prefix: '&8[&bSocialBlueprint&8]&r '

# ==============================================================================
# Reputation Tiers (SB-010, SB-011, SB-012, T-036)
#
# Nine visual tiers from baseline PlayerStatus, preserving visual tokens and colours.
# Display names are localized and defined in the language files (messages_<lang>.yml).
# Negative tiers must carry strictly negative thresholds (< 0) in ascending order.
# Neutral tier (tier0) threshold must be exactly 0.
# Positive tiers must carry strictly positive thresholds (> 0) in ascending order.
# ==============================================================================
tiers:
  tier-4:
    prefix: '&7[&4||||&7]'
    threshold: -50
  tier-3:
    prefix: '&7[&c|||&7]'
    threshold: -30
  tier-2:
    prefix: '&7[&c||&7]'
    threshold: -15
  tier-1:
    prefix: '&7[&c|&7]'
    threshold: -5
  tier0:
    prefix: '&7[&f|&7]'
    threshold: 0
  tier1:
    prefix: '&7[&a|&7]'
    threshold: 5
  tier2:
    prefix: '&7[&a||&7]'
    threshold: 15
  tier3:
    prefix: '&7[&a|||&7]'
    threshold: 30
  tier4:
    prefix: '&7[&b||||&7]'
    threshold: 50

# ==============================================================================
# Reputation Confidence (SB-003, T-013)
#
# Confidence measures how much evidence stands behind a player's reputation score.
# It is computed from the count of distinct players who have rated this player,
# weighted by the age of those ratings using exponential decay.
# Repeated ratings from the same actor do not raise confidence.
# ==============================================================================
confidence:
  # Exponential decay half-life for rating age (default: 30 days).
  # Durations support units like d (days), h (hours), m (minutes), s (seconds).
  # A bare number without a unit is interpreted as seconds.
  # After this period, a rating's contribution to confidence is halved.
  half-life: 30d

  # Minimum effective rating weight for 'Low' confidence (default: 1.0).
  # Requires at least 1 recent distinct player opinion.
  low-threshold: 1.0

  # Minimum effective rating weight for 'Established' confidence (default: 5.0).
  # Requires opinions from approximately 5 recent distinct players.
  established-threshold: 5.0

  # Minimum effective rating weight for 'High' confidence (default: 15.0).
  # Requires opinions from approximately 15 recent distinct players.
  high-threshold: 15.0

# ==============================================================================
# Reputation Decay (SB-006, Constitution Â§2.6, T-110)
#
# A reputation event's contribution to social status falls with its age.
# Nothing is deleted: the row stays, only its weight drops.
# This is separate from Reputation Confidence's age weighting (SB-003).
# ==============================================================================
decay:
  # Weight of a reputation event in the current status, by age.
  # A weight of 1.0 is a brand-new event; the weight halves every half-life.
  enabled: true
  half-life: 30d
  # Weight below which an event stops counting at all (0.0 keeps the tail).
  floor: 0.0
  # How long a derived status stays cached. Status now changes with time, not
  # only with writes, so this bounds how stale a displayed value can be.
  cache-ttl: 60s

# ==============================================================================
# Killing Psychosis (SB-004, T-014)
#
# Psychosis measures open-world PvP killing frequency over a rolling time window.
# Kills inside consensual duels affect neither social status nor Killing Psychosis.
# If these thresholds are too aggressive for an active PvP server, raise them below.
# ==============================================================================
psychosis:
  serenity:
    ceiling: 100
    active-hours-to-ceiling: 100
    idle-timeout-seconds: 300
  # Percentages; every other message and at least 75% of words/letters stay intact.
  chat:
    medium-rate: 10
    high-rate: 25
    extreme-rate: 40
    extent: 20
    min-letters: 6
  # Rolling evaluation window for counting PvP kills (default: 72 hours).
  window: 72h

  # Kill count threshold to reach 'Medium' psychosis (default: 2 kills).
  # Represents an occasional player-killer within the window.
  medium-threshold: 2

  # Kill count threshold to reach 'High' psychosis (default: 5 kills).
  # Represents a frequent, dangerous PvP combatant within the window.
  high-threshold: 5

  # Kill count threshold to reach 'Extreme' psychosis (default: 10 kills).
  # Represents a notorious, aggressive killer on a PvP rampage within the window.
  extreme-threshold: 10

# ==============================================================================
# Honor Economy (SB-050, SB-054, Decision 0001)
# ==============================================================================
honor:
  # Base monetary cost to give or remove honor (withdrawn via Vault economy).
  cost: 500.0

  # Progressive cost multiplier per rating issued by the actor within the window.
  multipliers:
    - 1.0
    - 1.5
    - 2.0
    - 3.0

  # How long an actor's own ratings keep raising the price of their next one, across all targets (Decision 0003).
  multiplier-window: 1h

  # Rolling window for the per-pair rating cap (SB-054, Decision 0003).
  # Must be longer than `cooldown-per-pair` times `max-per-target`.
  cap-window: 7d

  # Cooldown between ratings between the same actor and target player.
  cooldown-per-pair: 24h

  # Maximum ratings per actor-target pair inside the window (positive and negative counted separately).
  max-per-target: 3

# ==============================================================================
# Permission Nodes (SB-061, T-054)
# Action-to-permission node mapping resolved at check time.
# ==============================================================================
permissions:
  show: "socialblueprint.show"
  show-others: "socialblueprint.show.others"
  give-reputation: "socialblueprint.give"
  take-reputation: "socialblueprint.take"
  view-reputation: "socialblueprint.view"
  admin-adjust: "socialblueprint.admin.adjust"
  admin-config: "socialblueprint.admin.config"
  duel: "socialblueprint.duel"
  version: "socialblueprint.version"
  admin-update: "socialblueprint.admin.update"
  admin-import: "socialblueprint.admin.import"

# ==============================================================================
# Duels (SB-030, SB-031, SB-032, SB-033, T-060, T-063)
# ==============================================================================
duel:
  # Duration a challenge stays open before expiring if unaccepted (default: 60s).
  challenge-timeout: 60s

  # Disconnect handling during an active duel (SB-033, T-063).
  disconnect:
    # Time window after taking combat damage within which a disconnect is classified as a combat log (default: 10s).
    combat-log-window: 10s

    # Grace period to allow a disconnected player to reconnect before forfeiting the duel (default: 30s).
    # If set to 0s, the player immediately forfeits on disconnect.
    reconnect-grace-period: 30s

    # Social action taken on combat log. Supported: 'broadcast', 'notify'
    action: broadcast

  # Time window within which an attack's duel context remains valid before death (default: 30s, T-139).
  attack-context-window: 30s


# ==============================================================================
# Psychosis Ambient Effects (SB-043, SB-096 to SB-101)
#
# Private, cosmetic episodes triggered by Medium, High and Extreme Psychosis.
# ==============================================================================
effects:
  # Serenity episode settings.
  serenity:
    episodes:
      interval-ticks: 6000
      quiet-ticks: 200
    observer-range-blocks: 16
    dawn:
      enabled: true
      minimum-serenity: 1
      cooldown-ticks: 6000
      session-cap: 12
      time-ticks: 23000
      duration-ticks: 60
    source-less-sounds:
      enabled: true
      minimum-serenity: 1
      cooldown-ticks: 6000
      session-cap: 12
      sound-slot: serenity-clean
      offset:
        forward-blocks: 0
        right-blocks: 0
        up-blocks: 0
      playback-ticks: 60
    particles:
      enabled: true
      minimum-serenity: 1
      cooldown-ticks: 6000
      session-cap: 12
      type: end_rod
      placement: around
      # Maximum 64; shared delivery skips audiences needing more than 512 particle sends.
      count: 8
      radius-blocks: 1
      duration-ticks: 40
    apparition:
      enabled: true
      minimum-serenity: 1
      cooldown-ticks: 6000
      session-cap: 12
      kind: cat
      # Outside block reach: a packet-only animal is still pickable by the client,
      # so delivery skips any viewer whose reach could touch it (SB-124).
      range-blocks: 8
      duration-ticks: 60
  advancement-toast:
    enabled: true
    minimum-level: medium
    cooldown-ticks: 1200
    session-cap: 6
    icon: minecraft:paper
    duration-ticks: 60
  boss-bar:
    enabled: true
    minimum-level: medium
    cooldown-ticks: 1200
    session-cap: 6
    colour: purple
    style: progress
    progress: 0.5
    duration-ticks: 60
  false-death:
    enabled: true
    minimum-level: high
    cooldown-ticks: 1200
    session-cap: 6
    range-blocks: 16
  fake-connection:
    enabled: true
    minimum-level: medium
    cooldown-ticks: 18000
    session-cap: 6
  private-chat:
    enabled: true
    minimum-level: medium
    cooldown-ticks: 6000
    session-cap: 6
    max-visible-length: 160
  block-change:
    enabled: true
    minimum-level: high
    cooldown-ticks: 1200
    session-cap: 6
    block-data: minecraft:andesite
    range-blocks: 6
    duration-ticks: 40
  sign:
    enabled: true
    minimum-level: high
    cooldown-ticks: 1200
    session-cap: 6
    block-data: minecraft:oak_sign[rotation=0,waterlogged=false]
    range-blocks: 6
    duration-ticks: 40
  hurt-flash:
    enabled: true
    minimum-level: high
    cooldown-ticks: 1200
    session-cap: 6
    sound-slot: hurt
    playback-ticks: 20
  victim-ghost:
    enabled: true
    minimum-level: high
    cooldown-ticks: 1200
    session-cap: 6
    range-blocks: 6
    duration-ticks: 40
  episodes:
    medium:
      interval-ticks: 2400
    high:
      interval-ticks: 1200
    extreme:
      interval-ticks: 400
    quiet-ticks: 20
    duration-scale:
      medium: 1.0
      high: 1.5
      extreme: 2.0
  sky:
    enabled: true
    minimum-level: high
    cooldown-ticks: 1200
    session-cap: 6
    mode: night
    duration-ticks: 60
  particles:
    enabled: true
    minimum-level: medium
    cooldown-ticks: 1200
    session-cap: 6
    # Supported native types: smoke and end_rod; episode includes their finite client tail.
    type: smoke
    placement: around
    # Maximum 64 particles per private episode.
    count: 8
    radius-blocks: 1
    duration-ticks: 40
  screen-flash:
    enabled: true
    minimum-level: medium
    cooldown-ticks: 1200
    session-cap: 6
    channel: title
    fade-in-ticks: 5
    duration-ticks: 30
    fade-out-ticks: 5
  source-less-sounds:
    enabled: true
    minimum-level: medium
    cooldown-ticks: 1200
    session-cap: 6
    sound-slot: source-less
    offset:
      forward-blocks: -2
      right-blocks: 0
      up-blocks: 0
    playback-ticks: 20
  # Silence after a complete episode. Must decrease Medium > High > Extreme.
  # Minimums: 3/2/1 seconds and 3/2/1 scheduler checks respectively, even with zero cooldowns.
  quiet-interval:
    medium: 2m
    high: 1m
    extreme: 20s
  # Complete sound episode bound, including delayed layers; range 1 to 200 ticks.
  # Layers at or beyond this bound are skipped; playback is stopped at the bound.
  max-episode-ticks: 200
  # Session caps reset on player relog and on server restart.

  # How often the effect scheduler checks online players with Psychosis (default: 1s).
  check-interval: 1s

  # Timed packet-only hostile phantom outside interaction reach; High and Extreme only (SB-099)
  silverfish:
    cooldown: 10m
    session-cap: 6
    mobs: [silverfish, zombie, skeleton, spider, creeper, enderman]
    duration-ticks: 20
    distance-blocks: 8

  # Creeper fuse sound effect (SB-040)
  creeper:
    cooldown: 8m
    session-cap: 6

# ==============================================================================
# Updates from GitHub (SB-070 to SB-076, T-080 to T-085)
# ==============================================================================
update:
  # Check for updates from GitHub on server startup (SB-075, T-084). Default: true.
  check-on-startup: true

  # Automatically download updates to plugins/update/ on startup (SB-075, T-084). Default: false.
  auto-download: false

  # GitHub repository in <owner>/<repo> format (SB-076, T-080).
  repository: "Dasannn/Blueprint"

  # Release channel: 'stable' or 'beta' (SB-076, T-080). Default: stable.
  channel: "stable"

  # Base API URL (configurable for private mirrors or testing). Default: https://api.github.com
  api-url: "https://api.github.com"

  # Maximum allowed download size in bytes for release assets (SB-074). Default: 10485760 (10 MB).
  max-download-bytes: 10485760

# ==============================================================================
# Legacy Import (T-090, T-091, T-092)
# ==============================================================================
legacy-import:
  # Import rows keyed only by a name, resolving the name as it is owned today.
  # Off by default: Minecraft names can be reused, so a name-keyed row can
  # attach an old record to a different player.
  trust-name-lookup: false

# ==============================================================================
# Kill Penalty (SB-032, SB-034, SB-035, T-130 to T-133)
#
# Status lost for open-world kills outside sanctioned duels.
# ==============================================================================
kill-penalty:
  # Status lost for a kill outside a duel. 0 disables the feature entirely.
  delta: -1
  # One penalty per killer-victim pair inside this window.
  pair-cooldown: 30m
  # Most status one killer can lose automatically inside this window.
  cap-window: 7d
  max-loss: 10
  # Worlds where a kill costs nothing.
  exempt-worlds: []

# ==============================================================================
# Configurable Sounds (SB-090, SB-091, T-135 to T-137)
# ==============================================================================
sounds:
  hurt:
    key: minecraft:entity.player.hurt
    volume: 0.7
    pitch: 1.0
    category: PLAYERS
  serenity-clean:
    - key: minecraft:entity.parrot.ambient
      volume: 0.3
      pitch: 1.2
      category: AMBIENT
      delay: 0
    - key: minecraft:block.bell.resonate
      volume: 0.2
      pitch: 1.0
      category: AMBIENT
      delay: 10
    - key: minecraft:block.water.ambient
      volume: 0.3
      pitch: 1.0
      category: AMBIENT
      delay: 20
  source-less:
    - key: minecraft:block.stone.step
      volume: 0.7
      pitch: 1.0
      category: AMBIENT
      delay: 0
    - key: minecraft:block.stone.step
      volume: 0.7
      pitch: 1.0
      category: AMBIENT
      delay: 10
  # key: the Minecraft sound key. Empty key = silence.
  creeper-fuse:
    key: "entity.creeper.primed"
    volume: 1.0
    pitch: 0.5
    category: HOSTILE

# ==============================================================================
# Rating History GUI & Anonymity (SB-080 to SB-084, T-120 to T-126)
# ==============================================================================
history:
  # Cost in currency to reveal an anonymous rater's identity in the /status GUI (T-124).
  reveal-cost: 100.0

