name: SocialBlueprint
author: Dasannn
main: com.dasannn.socialblueprint.SocialBlueprintPlugin
version: '${project.version}'
description: Social layer plugin for Paper
api-version: '26.3'

commands:
  status:
    aliases: [pstatus, reputation]
    usage: /status [args]
    description: Social profile and actions

permissions:
  socialblueprint.admin.features:
    description: Toggle mental-state inputs and effects in the feature chest.
    default: op
  socialblueprint.admin.revoke:
    description: Revoke an honor rating without deleting its history.
  socialblueprint.admin.mind:
    description: Reset mental state for one or all stored players.
    default: op
  socialblueprint.*:
    description: All SocialBlueprint permissions
    default: op
    children:
      socialblueprint.show: true
      socialblueprint.show.others: true
      socialblueprint.give: true
      socialblueprint.take: true
      socialblueprint.view: true
      socialblueprint.duel: true
      socialblueprint.version: true
      socialblueprint.admin: true

  socialblueprint.admin:
    description: All administrative SocialBlueprint permissions
    default: op
    children:
      socialblueprint.admin.revoke: true
      socialblueprint.admin.features: true
      socialblueprint.admin.mind: true
      socialblueprint.admin.adjust: true
      socialblueprint.admin.config: true
      socialblueprint.admin.update: true
      socialblueprint.admin.import: true

  socialblueprint.show:
    description: Permite al jugador ver su propio estatus social
    default: true
  socialblueprint.show.others:
    description: Permite al jugador ver el estatus social de otros jugadores
    default: true
  socialblueprint.give:
    description: Permite al jugador dar honor a otros
    default: true
  socialblueprint.take:
    description: Permite al jugador retirar honor a otros
    default: true
  socialblueprint.view:
    description: Permite al jugador ver la reputación de otros jugadores
    default: true
  socialblueprint.version:
    description: Permite ver la versión del plugin y el estado de actualización
    default: true
  socialblueprint.admin.adjust:
    description: Permite al administrador ajustar o restablecer el estatus
    default: op
  socialblueprint.admin.config:
    description: Permite al administrador ver y editar la configuración
    default: op
  socialblueprint.duel:
    description: Permite al jugador participar en duelos
    default: true

  socialblueprint.admin.update:
    description: Permite al administrador descargar actualizaciones del plugin
  socialblueprint.admin.import:
    description: Permite al administrador importar datos de versiones anteriores
    default: op

  pstatus.show:
    children:
      socialblueprint.show: true
  pstatus.showOtherPlayers:
    children:
      socialblueprint.show.others: true
  pstatus.giveReputation:
    children:
      socialblueprint.give: true
      socialblueprint.take: true
  pstatus.addRemoveRep:
    children:
      socialblueprint.take: true
      socialblueprint.admin.adjust: true
  pstatus.setReputation:
    children:
      socialblueprint.admin.adjust: true
  pstatus.viewReputation:
    children:
      socialblueprint.view: true
  pstatus.admin:
    children:
      socialblueprint.admin: true

  socialblueprint.show-others:
    children:
      socialblueprint.show.others: true
  socialblueprint.give-reputation:
    children:
      socialblueprint.give: true
  socialblueprint.take-reputation:
    children:
      socialblueprint.take: true
  socialblueprint.admin-adjust:
    children:
      socialblueprint.admin.adjust: true

libraries:
  - org.xerial:sqlite-jdbc:3.53.4.0
